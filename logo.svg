<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="RootLens logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
<radialGradient id="glass" cx="0.35" cy="0.3" r="0.9"><stop offset="0" stop-color="#17395a"/><stop offset="1" stop-color="#07111d"/></radialGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4" stop-opacity="0"/><stop offset="1" stop-color="#5eead4" stop-opacity="0.45"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="lens"><circle cx="112" cy="112" r="84"/></clipPath>
</defs>
<style>
.flow{stroke-dasharray:5 7;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-12}}
.spin{transform-origin:112px 112px;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(2.2);opacity:0}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.flow,.spin,.pulse,.bob{animation:none}}
</style>
<ellipse cx="128" cy="244" rx="70" ry="7" fill="#000" opacity="0.25"/>
<g class="bob">
  <line x1="178" y1="178" x2="228" y2="228" stroke="#0a4a63" stroke-width="20" stroke-linecap="round"/>
  <line x1="178" y1="176" x2="226" y2="224" stroke="url(#g)" stroke-width="15" stroke-linecap="round"/>
  <line x1="182" y1="178" x2="222" y2="218" stroke="#fff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
  <circle cx="112" cy="112" r="88" fill="url(#glass)"/>
  <g clip-path="url(#lens)">
    <g class="spin"><path d="M112 112 L112 24 A88 88 0 0 1 188 68 Z" fill="url(#sweep)"/></g>
    <g fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" class="flow" opacity="0.95">
      <path d="M112 54 V96"/><path d="M112 96 L80 128"/><path d="M112 96 L144 126"/>
      <path d="M80 128 L62 160"/><path d="M80 128 L96 162"/><path d="M144 126 L130 162"/><path d="M144 126 L162 156"/>
    </g>
    <g fill="#5eead4" filter="url(#glow)">
      <circle cx="112" cy="54" r="6"/><circle cx="112" cy="96" r="5"/><circle cx="80" cy="128" r="5"/><circle cx="144" cy="126" r="5"/>
      <circle cx="62" cy="160" r="4"/><circle cx="96" cy="162" r="4"/><circle cx="162" cy="156" r="4"/>
    </g>
    <circle cx="130" cy="162" r="5" fill="#fb7185" filter="url(#glow)"/>
    <circle class="pulse" cx="130" cy="162" r="5" fill="none" stroke="#fb7185" stroke-width="2"/>
  </g>
  <circle cx="112" cy="112" r="88" fill="none" stroke="url(#g)" stroke-width="10"/>
  <circle cx="112" cy="112" r="94" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>
  <path d="M52 82 A66 66 0 0 1 100 48" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>
</g>
</svg>
