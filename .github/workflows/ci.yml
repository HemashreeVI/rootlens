name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run investigator tests
        run: python order-service/test_investigator.py
      - name: Run policy tests
        run: python controller/test_policy.py
      - name: Run safety tests
        run: python controller/test_safety.py
      - name: Run notification tests
        run: |
          pip install httpx
          python controller/test_notify.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build all images
        run: docker compose build