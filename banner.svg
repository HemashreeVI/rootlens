<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="RootLens: production reliability, with a human in the loop" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111d"/><stop offset="1" stop-color="#0c2238"/></linearGradient>
<linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<g id="cube">
<polygon points="0,-60 36,-42 0,-24 -36,-42" fill="currentColor"/>
<polygon points="-36,-42 0,-24 0,18 -36,0" fill="currentColor"/>
<polygon points="0,-24 36,-42 36,0 0,18" fill="currentColor"/>
<polygon points="0,-60 36,-42 0,-24 -36,-42" fill="#fff" opacity="0.38"/>
<polygon points="-36,-42 0,-24 0,18 -36,0" fill="#000" opacity="0.38"/>
<polygon points="0,-24 36,-42 36,0 0,18" fill="#000" opacity="0.14"/>
<polyline points="-36,-42 0,-24 36,-42 M0,-24 L0,18" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1"/>
</g>
</defs>
<style>
.dash{stroke-dasharray:6 8;animation:d 1.4s linear infinite}
@keyframes d{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion:reduce){.dash{animation:none}}
</style>
<rect width="1200" height="420" fill="url(#bg)"/>
<circle cx="930" cy="190" r="260" fill="url(#halo)"/>
<g stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1"><line x1="600" y1="292" x2="-600" y2="420" /><line x1="600" y1="292" x2="-500" y2="420" /><line x1="600" y1="292" x2="-400" y2="420" /><line x1="600" y1="292" x2="-300" y2="420" /><line x1="600" y1="292" x2="-200" y2="420" /><line x1="600" y1="292" x2="-100" y2="420" /><line x1="600" y1="292" x2="0" y2="420" /><line x1="600" y1="292" x2="100" y2="420" /><line x1="600" y1="292" x2="200" y2="420" /><line x1="600" y1="292" x2="300" y2="420" /><line x1="600" y1="292" x2="400" y2="420" /><line x1="600" y1="292" x2="500" y2="420" /><line x1="600" y1="292" x2="600" y2="420" /><line x1="600" y1="292" x2="700" y2="420" /><line x1="600" y1="292" x2="800" y2="420" /><line x1="600" y1="292" x2="900" y2="420" /><line x1="600" y1="292" x2="1000" y2="420" /><line x1="600" y1="292" x2="1100" y2="420" /><line x1="600" y1="292" x2="1200" y2="420" /><line x1="600" y1="292" x2="1300" y2="420" /><line x1="600" y1="292" x2="1400" y2="420" /><line x1="600" y1="292" x2="1500" y2="420" /><line x1="600" y1="292" x2="1600" y2="420" /><line x1="600" y1="292" x2="1700" y2="420" /><line x1="600" y1="292" x2="1800" y2="420" /><line x1="0" y1="300" x2="1200" y2="300" /><line x1="0" y1="310" x2="1200" y2="310" /><line x1="0" y1="324" x2="1200" y2="324" /><line x1="0" y1="344" x2="1200" y2="344" /><line x1="0" y1="372" x2="1200" y2="372" /><line x1="0" y1="410" x2="1200" y2="410" /></g>

<text x="60" y="170" font-size="92" font-weight="700" fill="url(#title)" font-family="'Segoe UI',Helvetica,Arial,sans-serif" letter-spacing="-2">RootLens</text>
<text x="64" y="212" font-size="24" fill="#cbd5e1" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Production reliability, with a human in the loop.</text>
<text x="64" y="262" font-size="26" fill="#7dd3fc" opacity="0" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Detect failures early
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.12;0.15;1" dur="14s" begin="0s" repeatCount="indefinite"/></text>
<text x="64" y="262" font-size="26" fill="#7dd3fc" opacity="0" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Collect the evidence
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.12;0.15;1" dur="14s" begin="2s" repeatCount="indefinite"/></text>
<text x="64" y="262" font-size="26" fill="#7dd3fc" opacity="0" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Rank the root causes
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.12;0.15;1" dur="14s" begin="4s" repeatCount="indefinite"/></text>
<text x="64" y="262" font-size="26" fill="#7dd3fc" opacity="0" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Estimate the blast radius
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.12;0.15;1" dur="14s" begin="6s" repeatCount="indefinite"/></text>
<text x="64" y="262" font-size="26" fill="#7dd3fc" opacity="0" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Fix through a guarded controller
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.12;0.15;1" dur="14s" begin="8s" repeatCount="indefinite"/></text>
<text x="64" y="262" font-size="26" fill="#7dd3fc" opacity="0" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Verify recovery
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.12;0.15;1" dur="14s" begin="10s" repeatCount="indefinite"/></text>
<text x="64" y="262" font-size="26" fill="#7dd3fc" opacity="0" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Escalate when unsure
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.12;0.15;1" dur="14s" begin="12s" repeatCount="indefinite"/></text>

<text x="64" y="352" font-size="15" fill="#64748b" font-family="'Segoe UI',Helvetica,Arial,sans-serif">FastAPI   Prometheus   Docker Compose   SQLite   GitHub Actions</text>

<!-- scan pulses -->
<ellipse cx="930" cy="168" rx="20" ry="8" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0">
<animate attributeName="rx" values="20;190" dur="3.3s" repeatCount="indefinite"/>
<animate attributeName="ry" values="8;76" dur="3.3s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.8;0" dur="3.3s" repeatCount="indefinite"/></ellipse>

<!-- links -->
<line x1="930" y1="130" x2="790" y2="246" stroke="#2dd4bf" stroke-width="2.5" class="dash"/>
<line x1="930" y1="130" x2="1070" y2="246" stroke="#2dd4bf" stroke-width="2.5" class="dash">
<animate attributeName="stroke" values="#2dd4bf;#2dd4bf;#f43f5e;#f43f5e;#2dd4bf;#2dd4bf" keyTimes="0;0.3;0.35;0.7;0.78;1" dur="10s" repeatCount="indefinite"/></line>

<!-- order -->
<g><animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="4s" repeatCount="indefinite"/>
<g transform="translate(930,150)" color="#2dd4bf"><use href="#cube"/></g></g>
<text x="930" y="196" text-anchor="middle" font-size="14" fill="#cbd5e1" font-family="'Segoe UI',Helvetica,Arial,sans-serif">order-service</text>

<!-- user -->
<g><animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="5s" repeatCount="indefinite"/>
<g transform="translate(790,268)" color="#2dd4bf"><use href="#cube"/></g></g>
<text x="790" y="314" text-anchor="middle" font-size="14" fill="#cbd5e1" font-family="'Segoe UI',Helvetica,Arial,sans-serif">user-service</text>

<!-- payment -->
<g><animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="4.5s" repeatCount="indefinite"/>
<g transform="translate(1070,268)" color="#2dd4bf"><animate attributeName="color" values="#2dd4bf;#2dd4bf;#f43f5e;#f43f5e;#2dd4bf;#2dd4bf" keyTimes="0;0.3;0.35;0.7;0.78;1" dur="10s" repeatCount="indefinite"/><use href="#cube"/></g></g>
<g transform="translate(1070,314)">
<text x="0" y="0" text-anchor="middle" font-size="14" fill="#cbd5e1" font-family="'Segoe UI',Helvetica,Arial,sans-serif">payment-service</text></g>
<g transform="translate(1070,334)">
<text x="0" y="0" text-anchor="middle" font-size="14" fill="#5eead4" opacity="0" font-family="'Segoe UI',Helvetica,Arial,sans-serif">v1 healthy
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0;0.02;0.28;0.3;1" dur="10s" repeatCount="indefinite"/></text>
<text x="0" y="0" text-anchor="middle" font-size="14" fill="#fb7185" opacity="0" font-family="'Segoe UI',Helvetica,Arial,sans-serif">v2 released: 50% errors
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.68;0.7;1" dur="10s" repeatCount="indefinite"/></text>
<text x="0" y="0" text-anchor="middle" font-size="14" fill="#5eead4" opacity="0" font-family="'Segoe UI',Helvetica,Arial,sans-serif">rolled back to v1
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.76;0.78;0.98;1.0;1" dur="10s" repeatCount="indefinite"/></text>
</g>

<!-- incident toast -->
<g transform="translate(930,64)">
<text x="0" y="0" text-anchor="middle" font-size="15" fill="#fb7185" opacity="0" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Incident opened. Likely cause: payment-service
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.5;0.7;0.72;1" dur="10s" repeatCount="indefinite"/></text>
<text x="0" y="0" text-anchor="middle" font-size="15" fill="#5eead4" opacity="0" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Incident resolved. Recovery verified.
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.84;0.96;0.98;1" dur="10s" repeatCount="indefinite"/></text>
</g>
</svg>
