<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="hero-t hero-d">
<title id="hero-t">RootLens: Reliability · Aiops · Human In The Loop</title>
<desc id="hero-d">Finds out why a microservice broke, and fixes it only within strict limits. Built with FastAPI, Docker, Prometheus, Grafana, OpenTelemetry, Jaeger. 118 unit tests passing; 3 causes scored per dependency; 2 approved fixes only</desc>
