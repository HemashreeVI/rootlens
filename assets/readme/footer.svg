ss="twinkle" cx="1089" cy="81" r="1" fill="#F3EEF8" style="animation-delay:4.0s"/><circle class="twinkle" cx="379" cy="37" r="0.8" fill="#F3EEF8" style="animation-delay:3.8s"/><circle class="twinkle" cx="1147" cy="84" r="1.2" fill="#F3EEF8" style="animation-delay:0.6s"/><circle class="twinkle" cx="69" cy="211" r="1.2" fill="#F3EEF8" style="animation-delay:1.4s"/><circle class="twinkle" cx="180" cy="210" r="1.6" fill="#F3EEF8" style="animation-delay:1.8s"/>
<text x="600" y="58" class="mono" font-size="12" fill="#EBD9A8" text-anchor="middle" letter-spacing="3">PRODUCTION RELIABILITY, WITH A HUMAN IN THE LOOP.</text>
