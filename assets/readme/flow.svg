<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 426" width="1200" height="426" role="img" aria-labelledby="flow-t flow-d">
<title id="flow-t">How RootLens works</title>
<desc id="flow-d">Detect (failure from live metrics) → Collect (errors, latency, deploys) → Rank (causes with confidence) → Impact (blast radius) → Fix (rollback or restart) → Verify (3 healthy checks) → Escalate (weak evidence → human)</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.spinr{animation:sr 40s linear infinite}@keyframes sr{to{transform:rotate(-360deg)}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<defs>
<radialGradient id="flow-bg" cx="70%" cy="30%" r="90%"><stop offset="0" stop-color="#24133D"/><stop offset=".55" stop-color="#130B20"/><stop offset="1" stop-color="#0A0612"/></radialGradient>
<radialGradient id="flow-glowA" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7A3FC2" stop-opacity=".5"/><stop offset="1" stop-color="#7A3FC2" stop-opacity="0"/></radialGradient>
<radialGradient id="flow-glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#EBD9A8" stop-opacity=".14"/><stop offset="1" stop-color="#EBD9A8" stop-opacity="0"/></radialGradient>
<linearGradient id="flow-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#F7EDD2"/><stop offset="1" stop-color="#EBD9A8"/></linearGradient>
<linearGradient id="flow-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EBD9A8" stop-opacity="0"/><stop offset=".25" stop-color="#EBD9A8" stop-opacity=".85"/><stop offset="1" stop-color="#EBD9A8" stop-opacity="0"/></linearGradient>
<pattern id="flow-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#EBD9A8" stroke-opacity=".05"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="424" rx="22" fill="url(#flow-bg)" stroke="#2E1D49"/>
<rect x="1" y="1" width="1198" height="424" rx="22" fill="url(#flow-grid)"/>
<ellipse cx="600" cy="213" rx="420" ry="298" fill="url(#flow-glowA)"/>
<ellipse cx="600" cy="213" rx="300" ry="213" fill="url(#flow-glowB)"/><g class="float" style="animation-delay:-0.0s">
<rect x="40" y="50" width="247" height="128" rx="18" fill="#1A0F2C" stroke="#45306B"/>
<circle cx="70" cy="82" r="13" fill="none" stroke="#EBD9A8"/>
<circle cx="70" cy="82" r="4.5" fill="#F7EDD2" class="pulse" style="animation-delay:0.0s"/>
<text x="94" y="87" class="mono" font-size="11" fill="#9E92B6" text-anchor="start" letter-spacing="2">01</text>
<text x="62" y="132" class="serif" font-size="26" fill="#F3EEF8" text-anchor="start" >Detect</text>
<text x="62" y="156" class="mono" font-size="12" fill="#D3C8E2" text-anchor="start" >failure from live metrics</text>
</g><g class="float" style="animation-delay:-0.7s">
<rect x="331" y="50" width="247" height="128" rx="18" fill="#1A0F2C" stroke="#45306B"/>
<circle cx="361" cy="82" r="13" fill="none" stroke="#EBD9A8"/>
<circle cx="361" cy="82" r="4.5" fill="#F7EDD2" class="pulse" style="animation-delay:0.5s"/>
<text x="385" y="87" class="mono" font-size="11" fill="#9E92B6" text-anchor="start" letter-spacing="2">02</text>
<text x="353" y="132" class="serif" font-size="26" fill="#F3EEF8" text-anchor="start" >Collect</text>
<text x="353" y="156" class="mono" font-size="12" fill="#D3C8E2" text-anchor="start" >errors, latency, deploys</text>
</g><g class="float" style="animation-delay:-1.4s">
<rect x="622" y="50" width="247" height="128" rx="18" fill="#1A0F2C" stroke="#45306B"/>
<circle cx="652" cy="82" r="13" fill="none" stroke="#EBD9A8"/>
<circle cx="652" cy="82" r="4.5" fill="#F7EDD2" class="pulse" style="animation-delay:1.0s"/>
<text x="676" y="87" class="mono" font-size="11" fill="#9E92B6" text-anchor="start" letter-spacing="2">03</text>
<text x="644" y="132" class="serif" font-size="26" fill="#F3EEF8" text-anchor="start" >Rank</text>
<text x="644" y="156" class="mono" font-size="12" fill="#D3C8E2" text-anchor="start" >causes with confidence</text>
</g><g class="float" style="animation-delay:-2.1s">
<rect x="913" y="50" width="247" height="128" rx="18" fill="#1A0F2C" stroke="#45306B"/>
<circle cx="943" cy="82" r="13" fill="none" stroke="#EBD9A8"/>
<circle cx="943" cy="82" r="4.5" fill="#F7EDD2" class="pulse" style="animation-delay:1.5s"/>
<text x="967" y="87" class="mono" font-size="11" fill="#9E92B6" text-anchor="start" letter-spacing="2">04</text>
<text x="935" y="132" class="serif" font-size="26" fill="#F3EEF8" text-anchor="start" >Impact</text>
<text x="935" y="156" class="mono" font-size="12" fill="#D3C8E2" text-anchor="start" >blast radius</text>
</g><g class="float" style="animation-delay:-2.8s">
<rect x="40" y="248" width="247" height="128" rx="18" fill="#1A0F2C" stroke="#45306B"/>
<circle cx="70" cy="280" r="13" fill="none" stroke="#EBD9A8"/>
<circle cx="70" cy="280" r="4.5" fill="#F7EDD2" class="pulse" style="animation-delay:2.0s"/>
<text x="94" y="285" class="mono" font-size="11" fill="#9E92B6" text-anchor="start" letter-spacing="2">05</text>
<text x="62" y="330" class="serif" font-size="26" fill="#F3EEF8" text-anchor="start" >Fix</text>
<text x="62" y="354" class="mono" font-size="12" fill="#D3C8E2" text-anchor="start" >rollback or restart</text>
</g><g class="float" style="animation-delay:-3.5s">
<rect x="331" y="248" width="247" height="128" rx="18" fill="#1A0F2C" stroke="#45306B"/>
<circle cx="361" cy="280" r="13" fill="none" stroke="#EBD9A8"/>
<circle cx="361" cy="280" r="4.5" fill="#F7EDD2" class="pulse" style="animation-delay:2.5s"/>
<text x="385" y="285" class="mono" font-size="11" fill="#9E92B6" text-anchor="start" letter-spacing="2">06</text>
<text x="353" y="330" class="serif" font-size="26" fill="#F3EEF8" text-anchor="start" >Verify</text>
<text x="353" y="354" class="mono" font-size="12" fill="#D3C8E2" text-anchor="start" >3 healthy checks</text>
</g><g class="float" style="animation-delay:-4.2s">
<rect x="622" y="248" width="247" height="128" rx="18" fill="#1A0F2C" stroke="#45306B"/>
<circle cx="652" cy="280" r="13" fill="none" stroke="#EBD9A8"/>
<circle cx="652" cy="280" r="4.5" fill="#F7EDD2" class="pulse" style="animation-delay:3.0s"/>
<text x="676" y="285" class="mono" font-size="11" fill="#9E92B6" text-anchor="start" letter-spacing="2">07</text>
<text x="644" y="330" class="serif" font-size="26" fill="#F3EEF8" text-anchor="start" >Escalate</text>
<text x="644" y="354" class="mono" font-size="12" fill="#D3C8E2" text-anchor="start" >weak evidence → human</text>
</g><path d="M292 114H324" fill="none" stroke="#EBD9A8" stroke-opacity=".7" stroke-dasharray="3 5"/><path d="M318 109l7 5-7 5" fill="none" stroke="#EBD9A8"/><circle r="3.5" fill="#fff"><animateMotion dur="2s" repeatCount="indefinite" begin="0.0s" path="M292 114H324"/></circle><path d="M583 114H615" fill="none" stroke="#EBD9A8" stroke-opacity=".7" stroke-dasharray="3 5"/><path d="M609 109l7 5-7 5" fill="none" stroke="#EBD9A8"/><circle r="3.5" fill="#fff"><animateMotion dur="2s" repeatCount="indefinite" begin="0.4s" path="M583 114H615"/></circle><path d="M874 114H906" fill="none" stroke="#EBD9A8" stroke-opacity=".7" stroke-dasharray="3 5"/><path d="M900 109l7 5-7 5" fill="none" stroke="#EBD9A8"/><circle r="3.5" fill="#fff"><animateMotion dur="2s" repeatCount="indefinite" begin="0.8s" path="M874 114H906"/></circle><path d="M1036 183V213H164V241" fill="none" stroke="#EBD9A8" stroke-opacity=".7" stroke-dasharray="3 5"/><path d="M158 235l5 7 5-7" fill="none" stroke="#EBD9A8"/><circle r="3.5" fill="#fff"><animateMotion dur="2s" repeatCount="indefinite" begin="1.2s" path="M1036 183V213H164V241"/></circle><path d="M292 312H324" fill="none" stroke="#EBD9A8" stroke-opacity=".7" stroke-dasharray="3 5"/><path d="M318 307l7 5-7 5" fill="none" stroke="#EBD9A8"/><circle r="3.5" fill="#fff"><animateMotion dur="2s" repeatCount="indefinite" begin="1.6s" path="M292 312H324"/></circle><path d="M583 312H615" fill="none" stroke="#EBD9A8" stroke-opacity=".7" stroke-dasharray="3 5"/><path d="M609 307l7 5-7 5" fill="none" stroke="#EBD9A8"/><circle r="3.5" fill="#fff"><animateMotion dur="2s" repeatCount="indefinite" begin="2.0s" path="M583 312H615"/></circle>
</svg>
