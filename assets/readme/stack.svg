<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 448" width="1200" height="448" role="img" aria-labelledby="stk-t stk-d">
<title id="stk-t">RootLens tech stack</title>
<desc id="stk-d">Services: FastAPI × 3, SQLite, Docker Compose; Metrics: Prometheus, Grafana; Tracing: OpenTelemetry, Jaeger; Control: policy engine, safety checks, Telegram; Delivery: deploy.ps1, versioned releases; Ci: GitHub Actions, 118 tests</desc>
<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.spinr{animation:sr 40s linear infinite}@keyframes sr{to{transform:rotate(-360deg)}}
.float{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<defs>
<radialGradient id="stk-bg" cx="70%" cy="30%" r="90%"><stop offset="0" stop-color="#24133D"/><stop offset=".55" stop-color="#130B20"/><stop offset="1" stop-color="#0A0612"/></radialGradient>
<radialGradient id="stk-glowA" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7A3FC2" stop-opacity=".5"/><stop offset="1" stop-color="#7A3FC2" stop-opacity="0"/></radialGradient>
<radialGradient id="stk-glowB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#EBD9A8" stop-opacity=".14"/><stop offset="1" stop-color="#EBD9A8" stop-opacity="0"/></radialGradient>
<linearGradient id="stk-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#F7EDD2"/><stop offset="1" stop-color="#EBD9A8"/></linearGradient>
<linearGradient id="stk-rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EBD9A8" stop-opacity="0"/><stop offset=".25" stop-color="#EBD9A8" stop-opacity=".85"/><stop offset="1" stop-color="#EBD9A8" stop-opacity="0"/></linearGradient>
<pattern id="stk-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#EBD9A8" stroke-opacity=".05"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="446" rx="22" fill="url(#stk-bg)" stroke="#2E1D49"/>
<rect x="1" y="1" width="1198" height="446" rx="22" fill="url(#stk-grid)"/>
<ellipse cx="600" cy="224" rx="420" ry="314" fill="url(#stk-glowA)"/>
