oke="#45306B"/><text x="439" y="264" class="mono" font-size="11" fill="#EBD9A8" text-anchor="start" letter-spacing="2.5">DELIVERY</text><text x="439" y="302" class="serif" font-size="22" fill="#F3EEF8" text-anchor="start" >deploy.ps1</text><text x="439" y="338" class="serif" font-size="17" fill="#D3C8E2" text-anchor="start" >versioned releases</text><rect x="797" y="232" width="363" height="176" rx="16" fill="#1A0F2C" stroke="#45306B"/><text x="817" y="264" class="mono" font-size="11" fill="#EBD9A8" text-anchor="start" letter-spacing="2.5">CI</text><text x="817" y="302" class="serif" font-size="22" fill="#F3EEF8" text-anchor="start" >GitHub Actions</text><text x="817" y="338" class="serif" font-size="17" fill="#D3C8E2" text-anchor="start" >118 tests</text>
