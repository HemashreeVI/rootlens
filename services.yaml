# What RootLens watches. Point RootLens at a different app by editing this file
# (services.otel-demo.yaml is a second example, for the OpenTelemetry Demo).
#
# Metrics are given as Prometheus selectors, so any naming scheme works.
# RootLens wraps them in rate(...[window]) itself.
#
# entry: the service customers call. Its failure ratio opens incidents.
# services: the services behind it. RootLens collects evidence about each one,
#   and may act on a service only through the actions listed for it.
# dependencies: who calls whom, used to work out which services are impacted.

window: 1m                              # rate window for every query

entry:
  service: order-service
  endpoint: /orders                     # shown on incidents
  up: 'up{job="order-service"}'
  requests: 'rootlens_order_requests_total{endpoint="/orders"}'
  errors: 'rootlens_order_requests_total{endpoint="/orders",status=~"5.."}'
  latency_buckets: 'rootlens_order_request_duration_seconds_bucket{endpoint="/orders"}'
  latency_unit: seconds                 # or milliseconds
  status_label: status                  # optional: break requests down by this
  timeout_seconds: 3                    # how long it waits for a dependency
  display_name: Order service
  role: "Front door: takes customer orders"

services:
  user-service:
    up: 'up{job="user-service"}'        # a query that is 1 while it runs
    requests: 'rootlens_user_requests_total{endpoint="/users/{user_id}"}'
    errors: 'rootlens_user_requests_total{endpoint="/users/{user_id}",status=~"5.."}'
    # How calls from the entry to this service fail, split by a label whose
    # values are "timeout", "error" or "unreachable".
    caller_failures: 'rootlens_order_dependency_failures_total{dependency="user-service"}'
    caller_failure_kind_label: kind
    url: http://user-service:8000       # where its /version endpoint lives
    version_env: USER_SERVICE_VERSION   # the .env key that pins its release
    display_name: User service
    role: Looks up the customer's account
    actions: [rollback_deployment, restart_service]

  payment-service:
    up: 'up{job="payment-service"}'
    requests: 'rootlens_payment_requests_total{endpoint="/pay/{order_id}"}'
    errors: 'rootlens_payment_requests_total{endpoint="/pay/{order_id}",status=~"5.."}'
    caller_failures: 'rootlens_order_dependency_failures_total{dependency="payment-service"}'
    caller_failure_kind_label: kind
    url: http://payment-service:8000
    version_env: PAYMENT_SERVICE_VERSION
    display_name: Payment service
    role: Charges the customer's payment
    actions: [rollback_deployment, restart_service]

dependencies:
  order-service: [user-service, payment-service]
