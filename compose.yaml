# Tracing settings shared by the three shop services (see "x-tracing" below).
x-tracing: &tracing
  OTEL_TRACES_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  # Don't trace the dashboard's and robot's polling, only real customer traffic.
  OTEL_PYTHON_EXCLUDED_URLS: "/metrics,/health,/version,/api/,/incidents,/deployments,/audit,/investigate,/dashboard"

services:
  user-service:
    build: ./user-service
    ports:
      - "8001:8000"
    environment:
      SERVICE_VERSION: ${USER_SERVICE_VERSION:-v1}
      OTEL_SERVICE_NAME: user-service
      <<: *tracing

  detector:
    build: ./detector
    depends_on:
      - prometheus
      - order-service

  controller:
    build: ./controller
    environment:
      CONTROLLER_MODE: ${CONTROLLER_MODE:-dry-run}
      ORDER_SERVICE_URL: http://order-service:8000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NOTIFY_CHAT_DEFAULT: ${NOTIFY_CHAT_DEFAULT:-}
      NOTIFY_CHAT_USER_SERVICE: ${NOTIFY_CHAT_USER_SERVICE:-}
      NOTIFY_CHAT_PAYMENT_SERVICE: ${NOTIFY_CHAT_PAYMENT_SERVICE:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:8002/dashboard}
      PROJECT_DIR: /project
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-rootlens}
    volumes:
      # Lets the executor ask Docker to recreate or restart a service.
      - /var/run/docker.sock:/var/run/docker.sock
      # The project folder, so it can read compose.yaml and update .env.
      - ./:/project
    depends_on:
      - order-service

  order-service:
    build: ./order-service
    ports:
      - "8002:8000"
    environment:
      USER_SERVICE_URL: http://user-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      DATABASE_PATH: /data/incidents.db
      OTEL_SERVICE_NAME: order-service
      <<: *tracing
    volumes:
      - rootlens-data:/data
    depends_on:
      - user-service
      - payment-service

  payment-service:
    build: ./payment-service
    ports:
      - "8003:8000"
    environment:
      SERVICE_VERSION: ${PAYMENT_SERVICE_VERSION:-v1}
      OTEL_SERVICE_NAME: payment-service
      <<: *tracing

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - user-service
      - order-service

  # Collects traces and shows them at http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  rootlens-data: